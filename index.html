<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0b12">
<meta name="description" content="Gloomhollow — a slow, Souls-like pixel dungeon crawler. Melee, parries, and eleven ways to die.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gloomhollow">
<title>Gloomhollow</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b12;--fg:#d9d0bd;--dim:#6d6578;--line:#464666;--btn:#1e1d2c;--btnon:#363650;--gold:#f4c968}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c0b12;--fg:#d9d0bd}}
:root[data-theme="dark"]{--bg:#0c0b12;--fg:#d9d0bd}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Press Start 2P','Courier New',monospace;overflow:hidden;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
body.touch #wrap{justify-content:flex-start;gap:0;padding-top:env(safe-area-inset-top)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#0c0b12;touch-action:none}
#help{font-size:8px;color:var(--dim);line-height:1.8;text-align:center;padding:0 12px}
#pad{display:none;flex:1;width:100%;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
body.touch #pad{display:block}body.touch #help{display:none}
#btns{position:absolute;left:0;right:0;top:0;height:46%;display:flex;padding:6px 14px 0;box-sizing:border-box}
.cluster{position:relative;flex:1.35}
#mid{flex:.6;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding-top:12px}
#stick,#aim{position:absolute;bottom:0;width:50%;height:54%}
#stick{left:0}#aim{right:0;border-left:1px solid #1e1d2c}
#stick::before,#aim::before{content:'';position:absolute;left:12px;right:12px;top:0;border-top:1px solid #1e1d2c}
.sbase,.sknob{position:absolute;border-radius:50%;pointer-events:none;display:none}
.sbase{width:96px;height:96px;border:2px solid var(--line);background:rgba(70,70,102,.15)}
.sknob{width:44px;height:44px;background:#8a8296;border:2px solid var(--fg)}
#aim .sbase{border-color:#8a7530}#aim .sknob{background:var(--gold);border-color:#e8a33c}
.hint{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:8px;line-height:1.8;color:var(--dim);pointer-events:none}
.b{display:flex;align-items:center;justify-content:center;background:var(--btn);border:2px solid var(--line);border-bottom-width:5px;color:var(--gold);font-size:10px;text-align:center;line-height:1.4;border-radius:6px}
.b.on{background:var(--btnon);border-bottom-width:2px}
.b.s{color:var(--dim);font-size:8px}.b.s.on{color:var(--gold)}
.b.rb{position:absolute;width:54px;height:54px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;border-bottom-width:4px;color:var(--fg)}
.b.rb.n{top:calc(50% - 54px)}.b.rb.s2{top:calc(50% + 54px)}.b.rb.w{left:calc(50% - 52px)}.b.rb.e{left:calc(50% + 52px)}
.b.rb.on{transform:translate(-50%,calc(-50% + 2px));border-bottom-width:2px}
.b.c-roll{border-color:#3d7a3f;color:#8fd08a}.b.c-block{border-color:#4a6fd0;color:#9fb8ff}.b.c-spell{border-color:#6a3f8a;color:#c4a0e8}.b.c-use{border-color:#8a7530;color:var(--gold)}.b.c-items{border-color:#6d6578;color:#d9d0bd}.b.c-flask{border-color:#a05a20;color:#f0a860}
.b.pill{width:44px;height:18px;border-radius:9px;font-size:7px;color:var(--dim);border-bottom-width:3px}

.b{display:flex;align-items:center;justify-content:center;background:var(--btn);border:2px solid var(--line);border-bottom-width:5px;color:var(--gold);font-size:9px;text-align:center;line-height:1.4;border-radius:6px}
.b.on{background:var(--btnon);border-bottom-width:2px}
.b.big{grid-column:4 / span 3;grid-row:1 / span 2;font-size:12px}
.b.s{color:var(--dim);font-size:8px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="help">WASD move &nbsp; mouse aim &nbsp; LMB attack &nbsp; SPACE roll &nbsp; E spell &nbsp; F flask &nbsp; SHIFT block/parry &nbsp; Q interact &nbsp; M map &nbsp; H controls</div>
<div id="pad">
 <div id="btns">
  <div class="cluster" id="lbtns">
   <div class="b rb n" data-k="pause">PAUSE</div><div class="b rb w c-items" data-k="items">ITEMS</div><div class="b rb e" data-k="map">MAP</div><div class="b rb s2 c-flask" data-k="flask">FLASK</div>
  </div>
  <div id="mid"><div class="b pill" data-k="mute">MUTE</div><div class="b pill" data-k="fs">FULL</div></div>
  <div class="cluster" id="rbtns">
   <div class="b rb n c-spell" data-k="bolt">SPELL</div><div class="b rb w c-use" data-k="use">USE</div><div class="b rb e c-block" data-k="block">BLOCK</div><div class="b rb s2 c-roll" data-k="roll">ROLL</div>
  </div>
 </div>
 <div id="stick"><div class="hint">move</div><div class="sbase"></div><div class="sknob"></div></div>
 <div id="aim"><div class="hint">pull to aim, release to strike<br>hold at the rim to charge</div><div class="sbase"></div><div class="sknob"></div></div>
</div>
</div>
<script>
(()=>{
const W=384,H=224,T=16;let CH=224;   // the view is 24x14 tiles: a standard 20x12 room sits inside a wall border, and the pixel scale drops a step
// The build number shown on the title screen is read from sw.js, so the cache version is the one source of truth.
let BUILD='';fetch('sw.js').then(r=>r.text()).then(t=>{const m=t.match(/gloomhollow-v(\d+)/);if(m)BUILD='build '+m[1];}).catch(()=>{});
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const isCoarse=matchMedia('(pointer:coarse)').matches;
let touchMode=isCoarse;if(isCoarse)document.body.classList.add('touch');
let BAND=0,OFFY=0,OFFX=0,baseOX=0,baseOY=0,camX=0,camY=0;const VIEW_MAX_H=320;
// The view is at most W x VIEW_MAX_H. Rooms that fit are centred as before; bigger rooms (loop templates) scroll with the player.
function fit(){const touch=document.body.classList.contains('touch');let s;let R=null;try{R=room;}catch(e){}const ph=R?Math.min(R.ph,VIEW_MAX_H):H,pw=R?Math.min(R.pw,W):W;
 if(touch){s=innerWidth/W;const half=innerHeight*0.5;let total=Math.round(half/s);total=Math.max(ph,Math.min(H+200,total));if(total*s>half){s=half/total;}CH=total;}
 else{CH=Math.max(H,ph);s=Math.max(1,Math.floor(Math.min(innerWidth/W,(innerHeight-40)/CH)));}
 cv.height=CH;baseOY=Math.floor((CH-ph)/2);baseOX=Math.floor((W-pw)/2);OFFX=baseOX;OFFY=baseOY;
 cv.style.width=W*s+'px';cv.style.height=CH*s+'px';try{updateCamera(0,true);}catch(e){}}
function updateCamera(dt,snap){let R=null,P=null;try{R=room;P=player;}catch(e){}if(!R||!P){OFFX=baseOX;OFFY=baseOY;return;}
 const tx=R.pw>W?Math.max(0,Math.min(R.pw-W,P.x-W/2)):0,ty=R.ph>CH?Math.max(0,Math.min(R.ph-CH,P.y-CH/2)):0;
 if(snap){camX=tx;camY=ty;}else{const k=Math.min(1,dt*7);camX+=(tx-camX)*k;camY+=(ty-camY)*k;}
 OFFX=baseOX-Math.round(camX);OFFY=baseOY-Math.round(camY);}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));document.addEventListener('fullscreenchange',()=>setTimeout(fit,200));fit();
// ---------- audio ----------
let AC=null,master=null,musicGain=null,sfxGain=null,muted=false;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(master);sfxGain=AC.createGain();sfxGain.gain.value=save.settings.sfx;sfxGain.connect(master);drone();}catch(e){}}
function setMute(m){muted=m;if(master)master.gain.value=m?0:0.5;}
// tone/noise fire now (SFX, through sfxGain); toneAt/noiseAt take an AudioContext time and a destination so the music can be scheduled ahead.
function tone(freq,dur,type,vol,slide){if(!AC||muted)return;toneAt(AC.currentTime,freq,dur,type,vol,slide,sfxGain);}
function toneAt(t,freq,dur,type,vol,slide,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,cut){if(!AC||muted)return;noiseAt(AC.currentTime,dur,vol,cut,sfxGain);}
function noiseAt(t,dur,vol,cut,dest){const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(nativeRandom()*2-1)*(1-i/n);const src=AC.createBufferSource();src.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut||1200;const g=AC.createGain();g.gain.value=vol;src.connect(f);f.connect(g);g.connect(dest||master);src.start(t);}
// Constant low bed under everything: filtered noise with a slow filter sweep plus a 55 Hz sine. (Was called ambient(), which
// collided with the particle function of the same name below, so it never actually played.)
function drone(){const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=nativeRandom()*2-1;const src=AC.createBufferSource();src.buffer=b;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=180;const g=AC.createGain();g.gain.value=0.045;src.connect(f);f.connect(g);g.connect(master);src.start();
 const lfo=AC.createOscillator();lfo.frequency.value=0.07;const lg=AC.createGain();lg.gain.value=70;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
 const o=AC.createOscillator();o.type='sine';o.frequency.value=55;const og=AC.createGain();og.gain.value=0.03;o.connect(og);og.connect(master);o.start();}
// Haptics (touch devices only; navigator.vibrate is a no-op where unsupported).
function buzz(p){if(!touchMode||!save||!save.settings||save.settings.haptics===false)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
const seq=(arr,gap,fn)=>arr.forEach((f,i)=>setTimeout(()=>fn(f),i*gap));
const SFX={
 swingL:()=>{noise(0.08,0.22,2600);tone(620,0.08,'triangle',0.07,320);},
 swingH:()=>{noise(0.18,0.32,1500);tone(280,0.18,'sawtooth',0.09,80);},
 hit:()=>{noise(0.07,0.4,900);tone(190,0.08,'square',0.14,60);},
 hitH:()=>{noise(0.13,0.5,650);tone(120,0.15,'square',0.2,40);},
 hurt:()=>{tone(230,0.22,'sawtooth',0.17,80);noise(0.1,0.3,600);},
 roll:()=>{noise(0.16,0.14,500);},
 fall:()=>{tone(520,0.55,'sine',0.12,90);noise(0.5,0.1,900);},
 shatter:()=>{noise(0.12,0.3,3200);seq([2400,1900,2800],35,f=>tone(f,0.05,'square',0.05));},
 relic:()=>{seq([523,784,1047,1568],90,f=>tone(f,0.35,'triangle',0.08));setTimeout(()=>tone(2093,0.6,'sine',0.05),360);},
 buy:()=>{seq([2600,2200,3000],45,f=>tone(f,0.04,'square',0.06));tone(160,0.12,'sine',0.12,90);},
 chest:()=>{noise(0.18,0.12,400);tone(90,0.2,'sawtooth',0.05,140);setTimeout(()=>seq([660,880,1320],70,f=>tone(f,0.12,'square',0.07)),160);},
 crackle:()=>{noise(0.05,0.05,2600);setTimeout(()=>noise(0.04,0.04,3200),70+Math.random()*90);},
 bubble:()=>{tone(180,0.14,'sine',0.06,320);setTimeout(()=>tone(140,0.12,'sine',0.05,260),120);},
 toll:()=>{tone(174,1.6,'sine',0.28,170);tone(348,1.2,'triangle',0.1,340);tone(523,0.6,'sine',0.06,520);noise(0.12,0.2,900);},
 roar:()=>{tone(110,1.5,'sawtooth',0.22,55);noise(1.1,0.35,500);tone(70,1.5,'square',0.1,40);},
 stomp:()=>{noise(0.08,0.22,240);tone(55,0.14,'sine',0.25,30);},
 leech:()=>{tone(300,0.25,'sine',0.1,90);noise(0.15,0.12,900);},
 bolt:()=>{tone(900,0.25,'sine',0.14,1900);tone(450,0.2,'square',0.05,900);},
 flask:()=>{tone(520,0.3,'sine',0.11,780);tone(780,0.3,'sine',0.07,1040);},
 drink:()=>seq([190,172,205],150,f=>{tone(f,0.13,'sine',0.13,f*0.6);noise(0.04,0.06,500);}),
 step:()=>noise(0.03,0.04,700),
 pickup:()=>seq([660,880,1320],70,f=>tone(f,0.12,'square',0.07)),
 slam:()=>{noise(0.4,0.7,300);tone(60,0.45,'sine',0.4,28);},
 ready:()=>{tone(1800,0.08,'square',0.1,2600);tone(2600,0.14,'sine',0.08,3300);},
 parry:()=>{tone(1400,0.16,'square',0.14,2300);noise(0.06,0.3,4000);tone(2400,0.3,'sine',0.07,3600);tone(140,0.14,'square',0.14,40);},
 block:()=>{noise(0.06,0.28,1800);tone(420,0.06,'square',0.09,300);},
 guardbreak:()=>{tone(300,0.32,'sawtooth',0.2,60);noise(0.2,0.4,800);},
 kill:()=>{noise(0.25,0.4,500);tone(150,0.3,'sawtooth',0.14,40);},
 die:()=>{tone(200,1.3,'sawtooth',0.25,38);},
 door:()=>{tone(220,0.45,'triangle',0.12,110);},
 spike:()=>{noise(0.05,0.22,3000);tone(1200,0.05,'square',0.05,600);},
 arrow:()=>{noise(0.1,0.14,3000);tone(1500,0.08,'triangle',0.05,900);},
 clear:()=>seq([440,554,659],110,f=>tone(f,0.25,'triangle',0.09)),
 boss:()=>{tone(80,1.1,'sawtooth',0.22,38);noise(0.7,0.3,200);},
 search:()=>{noise(0.15,0.2,800);tone(160,0.15,'triangle',0.08,120);},
 unlock:()=>seq([523,659,784,1047],90,f=>tone(f,0.3,'triangle',0.09)),
 riposte:()=>{noise(0.2,0.6,700);tone(90,0.25,'square',0.25,30);seq([880,1320],60,f=>tone(f,0.1,'square',0.06));}
};
// ---------- music ----------
// Procedural score. Notes are placed ~0.2 s ahead on the AudioContext clock, so the beat stays steady whatever the frame rate.
// Each biome has a root, a scale and a 4-chord progression (2 bars per chord); the mode picks tempo and which layers play.
// style picks the arrangement: gloom = slow and hollow, drowned = swung with dripping pings and open fifths, ember = driving sawtooth,
// throne = organ chords over a march, maw = the ember engine with growls. Loops drop every key two semitones and add a sour grace note.
const MUS={
 gloom:  {root:55,   scale:[0,2,3,5,7,8,10],prog:[0,5,3,4],style:'gloom'},    // A natural minor
 drowned:{root:58.27,scale:[0,2,3,5,7,9,10],prog:[0,3,6,4],style:'drowned'},  // Bb dorian
 ember:  {root:41.2, scale:[0,1,3,5,7,8,10],prog:[0,1,0,4],style:'ember'},    // E phrygian
 throne: {root:49,   scale:[0,2,3,5,7,8,11],prog:[0,3,5,4],style:'throne'},   // G harmonic minor
 bell:   {root:46.25,scale:[0,2,3,5,7,8,11],prog:[0,5,3,4],style:'bell'},     // F# harmonic minor, struck like a carillon
 maw:    {root:43.65,scale:[0,1,4,5,7,8,10],prog:[0,1,5,0],style:'maw'},      // F phrygian dominant
 won:    {root:65.41,scale:[0,2,4,5,7,9,11],prog:[0,4,5,3],style:'gloom'}};   // C major
const BPM={title:66,explore:84,pause:84,combat:96,boss:108,final:116,won:72};
const mus={next:0,step:0,mode:'off'};
const scaleNote=(m,deg,oct)=>{const n=m.scale.length,o=Math.floor(deg/n)+(oct||0);return m.root*Math.pow(2,(m.scale[((deg%n)+n)%n]+12*o)/12);};
function musicMode(){
 if(state==='title')return 'title';if(state==='won')return 'won';if(state!=='play')return 'off';
 if(overlayOpen==='pause')return 'pause';if(!room)return 'explore';
 if(room.type==='boss'&&room.spawned&&!room.cleared)return floor>=FINAL-1?'final':'boss';
 if(room.enemies.some(e=>!e.dead))return 'combat';return 'explore';}
function musicKey(mode){if(mode==='won')return MUS.won;if(mode==='title')return MUS.gloom;const base=floor>=FINAL?MUS.maw:floor===FINAL-1?MUS.throne:[MUS.gloom,MUS.drowned,MUS.ember,MUS.bell][BIOME()];
 return loop>0&&floor<FINAL-1?{...base,root:base.root*Math.pow(2,-2/12),dark:true}:base;}
function music(){
 if(!AC||muted||!musicGain||AC.state!=='running')return;
 const mode=musicMode(),now=AC.currentTime;
 musicGain.gain.setTargetAtTime((mode==='off'?0:mode==='pause'?0.3:1)*0.6*save.settings.music,now,0.3);
 mus.mode=mode;if(mode==='off')return;
 if(mus.next<now-0.25)mus.next=now+0.03;
 const sl=15/BPM[mode];
 while(mus.next<now+0.2){scheduleStep(mus.next,mode,sl);mus.next+=sl;mus.step++;}}
function scheduleStep(t,mode,sl){
 const m=musicKey(mode),s=mus.step,bar=Math.floor(s/16),b=s%16,chord=m.prog[Math.floor(bar/2)%4],st=m.style,dark=!!m.dark,rnd=nativeRandom;
 const note=(deg,oct,vol,dur,type,slide)=>{const f=scaleNote(m,deg,oct);toneAt(t,f,dur,type||'triangle',vol,slide?f*slide:0,musicGain);};
 const kick=v=>{noiseAt(t,0.08,v||0.3,160,musicGain);toneAt(t,70,0.12,'sine',(v||0.3)*1.15,32,musicGain);};
 const snare=v=>noiseAt(t,0.09,v,1800,musicGain),hat=v=>noiseAt(t,0.025,v,7000,musicGain),tom=v=>toneAt(t,110,0.16,'sine',v,60,musicGain);
 const drip=()=>note(chord+4+[0,3,7][Math.floor(rnd()*3)],3,0.035,sl*1.6,'sine',1.06);
 const organ=(vol,dur)=>{note(chord,1,vol,dur,'square');note(chord+2,1,vol*0.8,dur,'square');note(chord+4,1,vol*0.9,dur,'square');};
 if(mode==='won'){
  if(b===0)note(chord,0,0.18,sl*14);
  if(b%4===0)note(chord+[0,2,4,7][b/4],2,0.07,sl*5);
  if(b===0&&bar%2===0){note(chord+2,1,0.05,sl*30,'sine');note(chord+4,1,0.05,sl*30,'sine');}
  return;}
 // the sour grace note that marks a loop: a flat second under the chord on the last beat of every fourth bar
 if(dark&&b===14&&bar%4===3)note(chord+1,0,0.07,sl*3,'sawtooth');
 if(mode==='title'||mode==='explore'||mode==='pause'){
  const melody=()=>note([chord,chord+2,chord+4,chord+6][Math.floor(rnd()*4)],2,0.055,sl*3.2,st==='ember'?'square':'triangle');
  if(st==='drowned'){
   if(b===0)note(chord,-1,0.16,sl*12,'sine');if(b===10)note(chord+4,0,0.09,sl*5,'sine');
   if(b===0&&bar%2===0){note(chord,1,0.04,sl*30,'sine');note(chord+4,1,0.04,sl*30,'sine');}
   if((b===3||b===11)&&rnd()<0.6)drip();if(b===6&&rnd()<0.4)melody();}
  else if(st==='ember'||st==='maw'){
   if(b===0)note(chord,0,0.11,sl*8,'sawtooth');if(b===8)note(chord+4,0,0.08,sl*5,'sawtooth');
   if(b%2===0)note(chord,1,0.018,sl*0.9,'square');
   if(b%4===2&&rnd()<0.4)melody();if(b===14&&rnd()<0.3)note(chord+1,2,0.04,sl*2,'square');}
  else if(st==='bell'){
   if(b===0)note(chord,0,0.15,sl*10);if(b===0&&bar%2===0)organ(0.022,sl*30);
   if(b%8===4)note(chord+4,3,0.05,sl*8,'sine',0.998);if(b===0&&bar%4===2)note(chord,3,0.07,sl*14,'sine',0.997);   // struck bells, high and ringing down
   if(b===12&&rnd()<0.5)note(chord+[0,2,4][Math.floor(rnd()*3)],3,0.035,sl*6,'sine');}
  else if(st==='throne'){

// Rows r0..r1 of a sprite, feet at y: the torso can be drawn a hair wider (sx) and the upper body a pixel higher (dy) without the head growing or the feet leaving the floor.
function drawSprRows(s,x,y,flip,white,r0,r1,dy,sx){ctx.save();ctx.translate(Math.round(x),Math.round(y));if(flip<0)ctx.scale(-1,1);if(sx&&sx!==1)ctx.scale(sx,1);const img=white?s.white:s.img;ctx.drawImage(img,0,r0,s.w,r1-r0,-Math.floor(s.w/2),-s.h+r0+(dy||0),s.w,r1-r0);ctx.restore();}
function drawSpr(s,x,y,flip,white,wf){ctx.save();ctx.translate(Math.round(x),Math.round(y));if(flip<0)ctx.scale(-1,1);const img=white?s.white:s.img,ox=-Math.floor(s.w/2);
 if(!wf)ctx.drawImage(img,ox,-s.h);else{const L=3;ctx.drawImage(img,0,0,s.w,s.h-L,ox,-s.h-1,s.w,s.h-L);ctx.drawImage(img,0,s.h-L,s.w,L,ox+wf,-L,s.w,L);}ctx.restore();}

// School gear stacks: count the copies carried. Fire, frost, blood and arcane each have three pieces that build on one another.
const cnt=id=>{const it=player&&player.items.find(i=>i.id===id);return it?it.n:0;},fireMul=()=>1+0.25*cnt('kindling'),slowFor=b=>b*(1+cnt('hoarfrost')),spellCost=sp=>Math.max(4,Math.round(sp.cost*Math.pow(0.75,cnt('echo'))));
function unownedRelic(){const c=RELICS.filter(k=>!hasRelic(k));if(!c.length)return null;const w=c.map(k=>({common:3,uncommon:2,rare:1})[ITEMS[k].rar||'uncommon']);let t=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<c.length;i++){t-=w[i];if(t<0)return c[i];}return c[c.length-1];}

function relicKill(e){const p=player;if(p.hp<=0)return;if(hasRelic('lantern'))p.hp=Math.min(p.maxHp,p.hp+4);if(hasRelic('candle'))p.mana=Math.min(p.maxMana,p.mana+12);if(cnt('sanguine'))p.hp=Math.min(p.maxHp,p.hp+3*cnt('sanguine'));
 if(e&&e.slow>0&&cnt('brittle'))for(const o of room.enemies){if(o===e||o.dead)continue;if(Math.hypot(o.x-e.x,o.y-e.y)<40){o.slow=Math.max(o.slow||0,2*cnt('brittle'));burst(o.x,o.y-4,6,'#7fa8ff');}}}   // a chilled kill shatters cold onto its neighbours

function spare(){const p=player;if(p.hp>0||!hasRelic('bloodstone')||!run||run.spared)return false;run.spared=true;p.hp=30;p.inv=1.2;p.flash=0.3;burst(p.x,p.y-4,26,'#c8302a');banner={t:2.6,title:'BLOODSTONE',sub:'It cracks. You do not.',col:'#c8302a'};msg.t=0;SFX.relic();shake=Math.max(shake,0.3);hitstop=Math.max(hitstop,0.15);return true;}

function overlayTap(x,y){if(overlayOpen==='items'){const i=ITEM_CELL(x,y);if(i>=0&&i<player.items.length){itemSel=i;SFX.block();return;}}
 else if(overlayOpen==='skins'){const i=SKIN_CELL(x,y);if(i>=0){if(i===skinCursor){const id=SKIN_IDS[i];if(save.unlocked.includes(id)){equipSkin(id);SFX.pickup();overlayOpen=null;}else SFX.guardbreak();}else{skinCursor=i;SFX.block();}return;}}
 else if(overlayOpen==='pause'){const i=PAUSE_ROW(x,y);if(i>=0){pauseRow=i;SFX.block();return;}}
 overlayOpen=null;}

 for(const c of e.claws)if(c.planted){c.t-=dt;if(c.t<=0){c.planted=false;burst(c.x,c.y,8,'#6a1e1e');}}

 switch(e.state){
